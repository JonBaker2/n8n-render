# .github/workflows/n8n-auto-update.yml
name: N8N Auto-Update

on:
  schedule:
    # Check for updates every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger
  repository_dispatch:
    types: [n8n-update-check]

env:
  RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Get current N8N version
      id: current-version
      run: |
        if [ -f ".n8n-version" ]; then
          echo "version=$(cat .n8n-version)" >> $GITHUB_OUTPUT
        else
          echo "version=0.0.0" >> $GITHUB_OUTPUT
        fi
        
    - name: Get latest N8N version
      id: latest-version
      run: |
        LATEST=$(curl -s https://api.github.com/repos/n8n-io/n8n/releases/latest | jq -r '.tag_name' | sed 's/^n8n@//')
        echo "version=$LATEST" >> $GITHUB_OUTPUT
        echo "Latest N8N version: $LATEST"
        
    - name: Compare versions
      id: compare
      run: |
        CURRENT="${{ steps.current-version.outputs.version }}"
        LATEST="${{ steps.latest-version.outputs.version }}"
        
        if [ "$CURRENT" != "$LATEST" ]; then
          echo "update-needed=true" >> $GITHUB_OUTPUT
          echo "New version available: $CURRENT -> $LATEST"
        else
          echo "update-needed=false" >> $GITHUB_OUTPUT
          echo "N8N is up to date: $CURRENT"
        fi
        
    - name: Update Dockerfile
      if: steps.compare.outputs.update-needed == 'true'
      run: |
        LATEST="${{ steps.latest-version.outputs.version }}"
        
        # Update Dockerfile to use specific version
        sed -i "s|FROM n8nio/n8n:.*|FROM n8nio/n8n:$LATEST|g" Dockerfile
        
        # Update version file
        echo "$LATEST" > .n8n-version
        
    - name: Commit version update
      if: steps.compare.outputs.update-needed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Dockerfile .n8n-version
        git commit -m "chore: update N8N to version ${{ steps.latest-version.outputs.version }}" || exit 0
        git push
        
    - name: Trigger Render deployment
      if: steps.compare.outputs.update-needed == 'true'
      run: |
        if [ -n "$RENDER_DEPLOY_HOOK" ]; then
          echo "Triggering Render deployment..."
          curl -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deployment triggered successfully!"
        else
          echo "No Render deploy hook configured"
        fi
        
    - name: Send Slack notification
      if: steps.compare.outputs.update-needed == 'true' && env.SLACK_WEBHOOK != ''
      run: |
        curl -X POST "$SLACK_WEBHOOK" \
          -H "Content-Type: application/json" \
          -d '{
            "text": "🚀 N8N Auto-Update Triggered",
            "attachments": [
              {
                "color": "good",
                "fields": [
                  {
                    "title": "Previous Version",
                    "value": "${{ steps.current-version.outputs.version }}",
                    "short": true
                  },
                  {
                    "title": "New Version", 
                    "value": "${{ steps.latest-version.outputs.version }}",
                    "short": true
                  },
                  {
                    "title": "Status",
                    "value": "Deployment triggered on Render",
                    "short": false
                  }
                ]
              }
            ]
          }'
